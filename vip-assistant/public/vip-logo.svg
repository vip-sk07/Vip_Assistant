<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glow Filter -->
    <filter id="vip-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Core Gradients -->
    <linearGradient id="cyan-violet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="pink-amber-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="shield-stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="center-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#6366F1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Hexagonal Shield Frame -->
  <polygon points="256,36 436,110 436,330 256,476 76,330 76,110" 
           fill="none" 
           stroke="url(#shield-stroke-grad)" 
           stroke-width="12" 
           stroke-linejoin="round"
           filter="url(#vip-glow)" />

  <!-- Inner Cyber Mesh Lines -->
  <polygon points="256,64 410,128 410,318 256,444 102,318 102,128" 
           fill="rgba(15, 23, 42, 0.75)" 
           stroke="rgba(255, 255, 255, 0.12)" 
           stroke-width="4" 
           stroke-linejoin="round" />

  <!-- Core Radiant Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#center-core-glow)" />

  <!-- Stylized VIP Crown + AI Core Emblem -->
  <!-- Left Wing / 'V' Component -->
  <path d="M 148 160 L 256 380 L 206 200 Z" 
        fill="url(#cyan-violet-grad)" 
        opacity="0.95" />

  <!-- Right Wing / 'V' Component -->
  <path d="M 364 160 L 256 380 L 306 200 Z" 
        fill="url(#pink-amber-grad)" 
        opacity="0.95" />

  <!-- Center Diamond Crown Top -->
  <polygon points="256,120 310,185 256,250 202,185" 
           fill="url(#cyan-violet-grad)" 
           filter="url(#vip-glow)" />

  <!-- Central Glowing AI Diamond Orb -->
  <circle cx="256" cy="256" r="28" fill="#FFFFFF" filter="url(#vip-glow)" />
  <circle cx="256" cy="256" r="16" fill="#00F2FE" />

  <!-- Geometric Tech Nodes & Connectors -->
  <circle cx="148" cy="160" r="10" fill="#00F2FE" />
  <circle cx="364" cy="160" r="10" fill="#EC4899" />
  <circle cx="256" cy="120" r="10" fill="#A855F7" />
  <circle cx="256" cy="380" r="12" fill="#38BDF8" />

  <!-- Connecting Laser Ribbons -->
  <line x1="148" y1="160" x2="256" y2="120" stroke="#00F2FE" stroke-width="3" opacity="0.8" />
  <line x1="364" y1="160" x2="256" y2="120" stroke="#EC4899" stroke-width="3" opacity="0.8" />
  <line x1="148" y1="160" x2="256" y2="256" stroke="rgba(255,255,255,0.6)" stroke-width="2" />
  <line x1="364" y1="160" x2="256" y2="256" stroke="rgba(255,255,255,0.6)" stroke-width="2" />
  <line x1="256" y1="256" x2="256" y2="380" stroke="#38BDF8" stroke-width="3" opacity="0.9" />
</svg>
